<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#3498db" rx="8"/>
  <g fill="#ffffff">
    <!-- Radio body -->
    <rect x="12" y="24" width="40" height="28" rx="2" fill="#ecf0f1"/>
    <rect x="12" y="24" width="40" height="8" rx="2" fill="#34495e"/>

    <!-- Speaker grille -->
    <circle cx="22" cy="40" r="6" fill="#95a5a6"/>
    <circle cx="22" cy="40" r="4" fill="#34495e"/>

    <!-- Display -->
    <rect x="32" y="36" width="16" height="8" rx="1" fill="#2ecc71"/>
    <rect x="34" y="38" width="12" height="4" fill="#27ae60"/>

    <!-- Antenna -->
    <line x1="48" y1="24" x2="54" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="54" cy="12" r="2" fill="#e74c3c"/>

    <!-- Signal waves -->
    <path d="M 54 14 Q 56 16 58 18" stroke="#e74c3c" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 56 14 Q 58 16 60 18" stroke="#e74c3c" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>
</svg>
